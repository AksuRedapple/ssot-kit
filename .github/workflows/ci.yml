name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release metadata
        run: bash scripts/release-check.sh
      - name: Public surface audit
        run: bash scripts/public-audit.sh
      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts tools hooks -type f -name '*.sh' -print0)
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Packaged tests
        run: bash tools/tests/run_all.sh
      - name: Isolated install and upgrade preflight
        run: bash scripts/preflight.sh --quiet

  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must equal VERSION
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} != v${version}"
            exit 1
          }
